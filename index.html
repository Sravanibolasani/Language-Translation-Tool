
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple multilingual language translation tool.">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Language Translator</h1>
            <p class="subtitle">Translate text quickly and easily between languages.</p>
        </header>

        <main class="translator-box">

            <div class="language-row">
                <select id="sourceLanguage" aria-label="Source language">
                </select>

                <button id="swapButton" type="button" title="Swap languages" aria-label="Swap languages">
                    ⇄
                </button>

                <select id="targetLanguage" aria-label="Target language">
                </select>
            </div>

            <div class="text-area-row">

                <div class="text-box">
                    <label for="inputText">Enter text</label>
                    <textarea
                        id="inputText"
                        placeholder="Type or paste your text here..."
                        maxlength="5000"
                    ></textarea>
                    <span id="characterCount">0 / 5000 characters</span>
                </div>

                <div class="text-box">
                    <label for="outputText">Translation</label>
                    <textarea
                        id="outputText"
                        placeholder="Your translation will appear here..."
                        readonly
                    ></textarea>
                    <span id="outputCount">0 characters</span>
                </div>

            </div>

            <p id="statusMessage" role="status" aria-live="polite"></p>

            <button id="translateButton" type="button">
                Translate
            </button>

            <div class="action-row">
                <button id="copyButton" type="button">Copy Translation</button>
                <button id="clearButton" type="button">Clear</button>
                <button id="speakButton" type="button">🔊 Listen</button>
            </div>

        </main>

        <footer>
            <p>Powered by MyMemory Translation API</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
